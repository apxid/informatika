<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Logic Gate Builder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:#eef3f8;
height:100vh;
display:flex;
flex-direction:column;

}

header{

height:70px;
background:#1565c0;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
font-weight:700;
letter-spacing:1px;
box-shadow:0 4px 10px rgba(0,0,0,.15);

}

.container{

flex:1;
display:flex;
overflow:hidden;

}

/* ====================== */

.toolbox{

width:280px;
background:white;
padding:20px;
overflow:auto;
border-right:2px solid #d9d9d9;

}

.toolbox h2{

font-size:18px;
margin-bottom:15px;
color:#1565c0;

}

.section{

margin-bottom:25px;

}

.section-title{

font-weight:700;
margin-bottom:10px;
font-size:15px;
color:#444;

}

.item{

background:#f7f7f7;
border:2px solid #ddd;
border-radius:10px;
padding:12px;
margin-bottom:10px;
cursor:pointer;
transition:.25s;
font-weight:500;

}

.item:hover{

background:#e3f2fd;
transform:translateY(-2px);

}

/* ====================== */

.canvas{

flex:1;
background:#fafafa;
position:relative;
overflow:hidden;

}

.canvas-title{

position:absolute;
top:20px;
left:20px;
font-size:22px;
font-weight:bold;
color:#888;

}

/* ====================== */

.rightpanel{

width:280px;
background:white;
border-left:2px solid #ddd;
padding:20px;

}

.rightpanel h2{

color:#1565c0;
margin-bottom:20px;

}

.box{

background:#f8f8f8;
border-radius:12px;
padding:15px;
margin-bottom:15px;

}

.box h3{

font-size:15px;
margin-bottom:10px;

}

.status{

display:flex;
justify-content:space-between;
margin-top:8px;
font-weight:bold;

}

.true{

color:green;

}

.false{

color:red;

}

button{

width:100%;
padding:14px;
font-size:18px;
border:none;
background:#1565c0;
color:white;
border-radius:10px;
cursor:pointer;
margin-top:15px;

}

button:hover{

background:#0d47a1;

}

footer{

height:42px;
background:#1565c0;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:13px;

}

</style>

</head>

<body>

<header>

🧠 Logic Gate Builder

</header>

<div class="container">

<!-- TOOLBOX -->

<div class="toolbox">

<h2>📦 Toolbox</h2>

<div class="section">

<div class="section-title">

INPUT

</div>

<div class="item">🟢 Sensor Gerak</div>

<div class="item">🚪 Pintu</div>

<div class="item">🔘 Tombol</div>

<div class="item">💡 Saklar</div>

</div>

<div class="section">

<div class="section-title">

OUTPUT

</div>

<div class="item">💡 Lampu</div>

<div class="item">🚨 Alarm</div>

</div>

<div class="section">

<div class="section-title">

GERBANG LOGIKA

</div>

<div class="item">AND</div>

<div class="item">OR</div>

<div class="item">NOT</div>

<div class="item">XOR</div>

</div>

</div>

<!-- CANVAS -->

<div class="canvas">

<div class="canvas-title">

Area Kerja

</div>

</div>

<!-- PANEL -->

<div class="rightpanel">

<h2>📊 Hasil</h2>

<div class="box">

<h3>Input</h3>

<div class="status">

<span>Sensor</span>

<span class="false">FALSE</span>

</div>

<div class="status">

<span>Pintu</span>

<span class="false">FALSE</span>

</div>

</div>

<div class="box">

<h3>Output</h3>

<div class="status">

<span>Lampu</span>

<span class="false">OFF</span>

</div>

<div class="status">

<span>Alarm</span>

<span class="false">OFF</span>

</div>

</div>

<button>

▶ Jalankan Simulasi

</button>

</div>

</div>

<footer>

Developer MB • Logic Gate Builder v1.0

</footer>

</body>
</html>
