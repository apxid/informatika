<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Race - Game Pengacak Siswa Interactive</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="dark-mode">

  <div class="glass-container">
    <header>
      <h1>🏁 Class Race</h1>
      <button id="btn-fullscreen" class="btn-secondary">Fullscreen ⛶</button>
    </header>

    <!-- Form Setting -->
    <section id="setup-panel" class="panel">
      <h2>Pengaturan Balapan</h2>
      <div class="form-grid">
        <div class="form-group">
          <label for="select-class">Pilih Kelas:</label>
          <select id="select-class"><option value="">Loading...</option></select>
        </div>

        <div class="form-group">
          <label for="select-category">Kategori:</label>
          <select id="select-category"></select>
        </div>

        <div class="form-group">
          <label for="select-theme">Tema Balapan:</label>
          <select id="select-theme"></select>
        </div>

        <div class="form-group">
          <label for="select-count">Jumlah Peserta:</label>
          <select id="select-count">
            <option value="0">Semua Siswa</option>
            <option value="5">5 Siswa</option>
            <option value="10" selected>10 Siswa</option>
            <option value="15">15 Siswa</option>
            <option value="20">20 Siswa</option>
          </select>
        </div>
      </div>

      <div class="form-checkbox">
        <label>
          <input type="checkbox" id="chk-exclude">
          Abaikan pemenang sebelumnya pada kategori ini
        </label>
      </div>

      <button id="btn-start" class="btn-primary">Mulai Balapan 🚀</button>
    </section>

    <!-- Race Track Container -->
    <section id="race-panel" class="panel hidden">
      <div id="countdown-overlay" class="hidden">
        <span id="countdown-text">3</span>
      </div>
      <div id="track-container" class="track-box"></div>
    </section>

    <!-- Podium Winner Modal -->
    <div id="winner-modal" class="modal hidden">
      <div class="modal-content glass-card">
        <h2>🎉 Pemenang Balapan 🎉</h2>
        <div class="podium">
          <div class="podium-slot rank-2"><p>🥇 Juara 2</p><span id="winner-2">-</span></div>
          <div class="podium-slot rank-1"><p>🏆 Juara 1</p><span id="winner-1">-</span></div>
          <div class="podium-slot rank-3"><p>🥉 Juara 3</p><span id="winner-3">-</span></div>
        </div>
        <button id="btn-reset" class="btn-primary">Kembali ke Pengaturan</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="gas.js"></script>
  <script src="script.js"></script>
</body>
</html>
