<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard Rekap Tugas</title>

<style>
body{
  font-family:Arial, sans-serif;
  background:#f4f6f9;
  padding:20px;
}

h2{ margin-bottom:15px; }

.topbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
  align-items:center;
}

select, button, input[type="number"], input[type="password"]{
  padding:8px;
  border-radius:4px;
  border:1px solid #ccc;
}

button{
  background:#0A4FA3;
  color:white;
  border:none;
  cursor:pointer;
  transition: background 0.2s;
}

button:hover{
  background:#083d82;
}

.btn-simpan{
  background:#28a745;
  padding:5px 8px;
  font-size:12px;
}

.btn-simpan:hover{
  background:#218838;
}

.btn-hapus{
  background:#dc3545;
  padding:5px 8px;
  font-size:12px;
  margin-left:3px;
}

.btn-hapus:hover{
  background:#c82333;
}

button:disabled{
  background:#6c757d !important;
  cursor:not-allowed;
}

.input-nilai{
  width:55px;
  text-align:center;
}

.input-pin{
  width:110px;
}

.admin-area {
  background: #e9ecef;
  padding: 4px 8px;
  border-radius: 6px;
  display: flex;
  gap: 6px;
  align-items: center;
}

.container{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.box{
  flex:1;
  min-width:320px;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

th, td{
  border:1px solid #ddd;
  padding:6px;
  text-align:center;
}

th{
  background:#f0f0f0;
}

.sudah{ color:green; }
.belum{ color:red; }

#statistik{
  margin-bottom:10px;
  font-weight:bold;
}

.action-cell {
  white-space: nowrap;
}
</style>
</head>

<body>

<h2>📊 Dashboard Rekap Pengumpulan Tugas</h2>

<div class="topbar">
  <select id="filterKelas">
    <option value="ALL">Semua Kelas</option>
  </select>

  <select id="filterJudul">
    <option value="ALL">Semua Judul</option>
  </select>

  <button onclick="renderData()">Tampilkan</button>

  <div class="admin-area">
    <label style="font-size: 12px; font-weight: bold;">🔑 PIN Guru:</label>
    <input type="password" id="pinAdmin" class="input-pin" placeholder="PIN Guru">
  </div>
</div>

<div id="statistik">Memuat data...</div>

<div class="container">

<div class="box">
<h3 class="sudah">🟢 Sudah Mengirim</h3>
<table>
<thead>
<tr>
<th>No</th>
<th>Kelompok</th>
<th>Nama Anggota</th>
<th>Link</th>
<th>Nilai</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="sudahList"></tbody>
</table>
</div>

<div class="box">
<h3 class="belum">🔴 Belum Mengirim</h3>
<ol id="belumList"></ol>
</div>

</div>

<script>

const url="https://script.google.com/macros/s/AKfycbwOAjGhkqMB5A9Ui4hHqcapjYcy1Rz_LNTjmcPXiwP975LJMfvDsp4aGo0MnWOtFoAEWw/exec";

let semuaSiswa=[];
let semuaTugas=[];

// Ambil PIN dari session jika sebelumnya pernah dimasukkan
document.getElementById("pinAdmin").value = sessionStorage.getItem("pin_guru") || "";

document.getElementById("pinAdmin").addEventListener("input", function(e) {
  sessionStorage.setItem("pin_guru", e.target.value);
});

/* LOAD DATA */
function loadData(){
  document.getElementById("statistik").innerHTML = "Memuat data...";
  Promise.all([
    fetch(url+"?action=getDataSiswa").then(r=>r.json()),
    fetch(url+"?action=getDataTugas").then(r=>r.json())
  ])
  .then(([siswa,tugas])=>{
    semuaSiswa = siswa || [];
    semuaTugas = tugas || [];
    initFilter();
    renderData();
  })
  .catch(()=>{
    document.getElementById("statistik").innerHTML="Gagal mengambil data dari server.";
  });
}

loadData();

/* INIT FILTER */
function initFilter(){
  const selectKelas = document.getElementById("filterKelas");
  const selectJudul = document.getElementById("filterJudul");

  const valKelasSebelumnya = selectKelas.value;
  const valJudulSebelumnya = selectJudul.value;

  selectKelas.innerHTML = '<option value="ALL">Semua Kelas</option>';
  selectJudul.innerHTML = '<option value="ALL">Semua Judul</option>';

  const kelasSet=[...new Set(semuaSiswa.map(s=>s.rombel))].sort();
  const judulSet=[...new Set(semuaTugas.map(t=>t.judul))].filter(Boolean).sort();

  kelasSet.forEach(k=>{ selectKelas.innerHTML += `<option value="${k}">${k}</option>`; });
  judulSet.forEach(j=>{ selectJudul.innerHTML += `<option value="${j}">${j}</option>`; });

  if(kelasSet.includes(valKelasSebelumnya)) selectKelas.value = valKelasSebelumnya;
  if(judulSet.includes(valJudulSebelumnya)) selectJudul.value = valJudulSebelumnya;
}

/* RENDER DATA */
function renderData(){
  const kelas=document.getElementById("filterKelas").value;
  const judul=document.getElementById("filterJudul").value;

  let siswaKelas=semuaSiswa;
  if(kelas!=="ALL"){
    siswaKelas=siswaKelas.filter(s=>s.rombel===kelas);
  }

  let tugas=semuaTugas;
  if(kelas!=="ALL"){
    tugas=tugas.filter(t=>t.kelas===kelas);
  }
  if(judul!=="ALL"){
    tugas=tugas.filter(t=>t.judul===judul);
  }

  let sudahSet=new Set();
  tugas.forEach(t=>{
    if(t.nama){
      t.nama.split(",").forEach(n=>{
        if(n.trim()) sudahSet.add(n.trim());
      });
    }
  });

  const total=siswaKelas.length;
  const belum=siswaKelas.filter(s=>!sudahSet.has(s.nama));

  let htmlSudah = "";

  tugas.forEach((t, i) => {
    const listNama = t.nama ? t.nama.split(",").map(n => n.trim()).filter(n => n !== "") : ["-"];
    const jumlahAnggota = listNama.length;
    const nilaiAwal = (t.nilai !== undefined && t.nilai !== null) ? t.nilai : "";
    
    // Identifier unik untuk tugas (menggunakan ID jika ada, atau kombinasi atribut)
    const tId = t.id || i;

    listNama.forEach((nama, indexNama) => {
      htmlSudah += `<tr>`;
      
      if (indexNama === 0) {
        htmlSudah += `<td rowspan="${jumlahAnggota}">${i + 1}</td>`;
        htmlSudah += `<td rowspan="${jumlahAnggota}">${t.kelompok}</td>`;
      }
      
      htmlSudah += `<td style="text-align:left;">${nama}</td>`;
      
      if (indexNama === 0) {
        const linkHtml = t.link ? `<a href="${t.link}" target="_blank">Buka</a>` : '-';
        htmlSudah += `<td rowspan="${jumlahAnggota}">${linkHtml}</td>`;
        
        // Input Nilai
        htmlSudah += `<td rowspan="${jumlahAnggota}">
          <input type="number" id="nilai_${i}" class="input-nilai" value="${nilaiAwal}" min="0" max="100" placeholder="0-100">
        </td>`;
        
        // Tombol Simpan & Hapus
        htmlSudah += `<td rowspan="${jumlahAnggota}" class="action-cell">
          <button id="btn_simpan_${i}" class="btn-simpan" onclick="simpanNilai(${i}, '${t.kelompok}', '${t.kelas}', '${t.judul}')">Simpan</button>
          <button id="btn_hapus_${i}" class="btn-hapus" onclick="hapusTugas(${i}, '${tId}', '${t.kelompok}', '${t.kelas}', '${t.judul}', '${t.link}')">Hapus</button>
        </td>`;
      }
      
      htmlSudah += `</tr>`;
    });
  });

  document.getElementById("sudahList").innerHTML = htmlSudah || '<tr><td colspan="6">Belum ada data pengumpulan</td></tr>';
  document.getElementById("belumList").innerHTML = belum.length > 0
    ? belum.map(s => `<li>${s.nama} (${s.rombel})</li>`).join("")
    : "<li>Semua siswa sudah mengumpulkan.</li>";

  document.getElementById("statistik").innerHTML = 
    `Total Siswa: ${total} | Sudah Mengumpulkan: ${sudahSet.size} | Belum: ${belum.length}`;
}

/* FUNGSI SIMPAN NILAI */
function simpanNilai(index, kelompok, kelas, judul) {
  const pinVal = document.getElementById("pinAdmin").value;
  const inputEl = document.getElementById(`nilai_${index}`);
  const btnEl = document.getElementById(`btn_simpan_${index}`);
  const nilaiVal = inputEl.value;

  if (!pinVal) {
    alert("Masukkan PIN Guru terlebih dahulu di bagian atas!");
    document.getElementById("pinAdmin").focus();
    return;
  }

  if (nilaiVal === "") {
    alert("Silakan masukkan nilai terlebih dahulu!");
    return;
  }

  btnEl.disabled = true;
  btnEl.innerText = "...";

  const targetUrl = `${url}?action=simpanNilai&pin=${encodeURIComponent(pinVal)}&kelompok=${encodeURIComponent(kelompok)}&kelas=${encodeURIComponent(kelas)}&judul=${encodeURIComponent(judul)}&nilai=${encodeURIComponent(nilaiVal)}`;

  fetch(targetUrl)
    .then(r => r.json())
    .then(res => {
      btnEl.disabled = false;
      btnEl.innerText = "Simpan";

      if (res.status === "success") {
        alert(`Nilai ${nilaiVal} untuk ${kelompok} berhasil disimpan!`);
        const itemTugas = semuaTugas.find(t => t.kelompok === kelompok && t.kelas === kelas && t.judul === judul);
        if (itemTugas) itemTugas.nilai = nilaiVal;
      } else {
        alert("Gagal: " + (res.message || "Terjadi kesalahan"));
      }
    })
    .catch(err => {
      btnEl.disabled = false;
      btnEl.innerText = "Simpan";
      alert("Terjadi kesalahan jaringan atau server.");
    });
}

/* FUNGSI HAPUS BARIS TUGAS DENGAN PIN */
function hapusTugas(index, id, kelompok, kelas, judul, link) {
  const pinVal = document.getElementById("pinAdmin").value;
  const btnEl = document.getElementById(`btn_hapus_${index}`);

  if (!pinVal) {
    alert("Masukkan PIN Guru terlebih dahulu di bagian atas!");
    document.getElementById("pinAdmin").focus();
    return;
  }

  if (!confirm(`Yakin ingin menghapus pengumpulan dari ${kelompok} (${kelas})?`)) {
    return;
  }

  btnEl.disabled = true;
  btnEl.innerText = "...";

  const targetUrl = `${url}?action=hapusTugas&pin=${encodeURIComponent(pinVal)}&id=${encodeURIComponent(id)}&kelompok=${encodeURIComponent(kelompok)}&kelas=${encodeURIComponent(kelas)}&judul=${encodeURIComponent(judul)}&link=${encodeURIComponent(link)}`;

  fetch(targetUrl)
    .then(r => r.json())
    .then(res => {
      btnEl.disabled = false;
      btnEl.innerText = "Hapus";

      if (res.status === "success") {
        alert(`Pengumpulan ${kelompok} berhasil dihapus!`);
        
        // Hapus dari memori lokal dan render ulang tampilan
        semuaTugas = semuaTugas.filter(t => !(t.kelompok === kelompok && t.kelas === kelas && t.judul === judul && (t.link === link || t.id === id)));
        renderData();
      } else {
        alert("Gagal menghapus: " + (res.message || "Terjadi kesalahan"));
      }
    })
    .catch(err => {
      btnEl.disabled = false;
      btnEl.innerText = "Hapus";
      alert("Terjadi kesalahan jaringan atau server.");
    });
}

</script>

</body>
</html>
