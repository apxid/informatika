<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai Try Out TKA - SMP Negeri 1 Moga</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a192f;
            --primary-blue: #112240;
            --accent-yellow: #facc15; /* Kuning OSIS SMP */
            --accent-green: #4ade80;  /* Hijau Muda Stabillo */
            --text-white: #ffffff;
            --text-gray: #94a3b8;
            --glass-bg: rgba(17, 34, 64, 0.75);
            --glass-border: rgba(250, 204, 21, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #050b14 0%, #0a192f 50%, #112240 100%);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Animated Glow Elements */
        .glow-circle {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(74, 222, 128, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            animation: float 8s infinite alternate ease-in-out;
        }
        .glow-circle.two {
            background: rgba(250, 204, 21, 0.12);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-35px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 550px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Card Style */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        .logo-container img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.4));
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: var(--accent-yellow);
        }

        p.subtitle {
            font-size: 0.88rem;
            color: var(--text-gray);
            margin-bottom: 25px;
        }

        /* Layer 1: Form Input */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--accent-yellow);
            margin-bottom: 8px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-with-icon input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-yellow), #eab308);
            border: none;
            border-radius: 12px;
            color: var(--bg-dark);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.55);
            background: linear-gradient(135deg, #fde047, var(--accent-yellow));
        }

        /* Layer 2: Result Data */
        .result-container {
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-info {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: left;
        }

        .student-info h2 {
            font-size: 1.1rem;
            color: var(--accent-yellow);
            margin-bottom: 4px;
        }

        .student-info p {
            font-size: 0.85rem;
            color: var(--text-gray);
        }

        .scores-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .score-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        .score-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.08);
        }

        .score-label {
            text-align: left;
        }

        .score-label h4 {
            font-size: 0.9rem;
            color: var(--text-white);
            margin-bottom: 3px;
        }

        .score-label span {
            font-size: 0.75rem;
            color: var(--text-gray);
        }

        .score-value {
            text-align: right;
        }

        .score-num {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        .badge {
            display: inline-block;
            padding: 3px 9px;
            font-size: 0.65rem;
            font-weight: 600;
            border-radius: 6px;
            text-transform: uppercase;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .badge.memadai { background: rgba(74, 222, 128, 0.2); color: var(--accent-green); border: 1px solid rgba(74, 222, 128, 0.4); }
        .badge.baik { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .badge.kurang { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

        .btn-back {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-white);
            padding: 12px;
            width: 100%;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-white);
        }

        /* Loading Spinner Overlay */
        .loader-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 25, 47, 0.85);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(250, 204, 21, 0.2);
            border-top: 4px solid var(--accent-yellow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-gray);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="glow-circle"></div>
    <div class="glow-circle two"></div>

    <div class="container">
        <div class="glass-card">
            <div class="logo-container">
                <img src="https://smpn1moga.sch.id/wp-content/uploads/2025/08/NEW-LOGO-SMP-1-MOGA-1024x961.jpg" alt="Logo SMPN 1 Moga">
            </div>
            
            <!-- LAYER 1: FORM INPUT -->
            <div id="layer1">
                <h1>TRY OUT <span>TKA</span></h1>
                <p class="subtitle">SMP Negeri 1 Moga</p>
                
                <form id="nisnForm" onsubmit="handleSearch(event)">
                    <div class="form-group">
                        <label for="nisnInput">Masukkan Nomor NISN Siswa</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="number" id="nisnInput" placeholder="Contoh: 101192481" required autocomplete="off">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-magnifying-glass"></i> Cek Hasil Nilai
                    </button>
                    <div id="errorMsg" class="error-msg"></div>
                </form>
            </div>

            <!-- LAYER 2: HASIL NILAI -->
            <div id="layer2" class="result-container">
                <div class="student-info">
                    <h2 id="resNama">-</h2>
                    <p>Kelas: <span id="resKelas">-</span> &bull; NISN: <span id="resNisn">-</span></p>
                </div>

                <div class="scores-grid">
                    <!-- Bahasa Indonesia -->
                    <div class="score-card">
                        <div class="score-label">
                            <h4>Bahasa Indonesia</h4>
                            <span>Capaian: <span id="resCapaianIndo" class="badge">-</span></span>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resIndo">0</div>
                        </div>
                    </div>

                    <!-- Matematika -->
                    <div class="score-card">
                        <div class="score-label">
                            <h4>Matematika</h4>
                            <span>Capaian: <span id="resCapaianMtk" class="badge">-</span></span>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resMtk">0</div>
                        </div>
                    </div>

                    <!-- Rata-Rata -->
                    <div class="score-card" style="border-color: rgba(250, 204, 21, 0.4); background: rgba(250, 204, 21, 0.03);">
                        <div class="score-label">
                            <h4>Nilai Rata-Rata</h4>
                            <span>Capaian: <span id="resCapaianRata" class="badge">-</span></span>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resRata" style="color: var(--accent-yellow);">0</div>
                        </div>
                    </div>
                </div>

                <button class="btn-back" onclick="resetForm()">
                    <i class="fa-solid fa-arrow-left"></i> Cari NISN Lain
                </button>
            </div>
        </div>

        <footer>
            &copy; 2026 SMP Negeri 1 Moga &bull; IT Development Team
        </footer>
    </div>

    <!-- Loader Overlay -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="color: var(--accent-yellow); font-size: 0.9rem; font-weight: 500;">Memuat Data Siswa...</p>
    </div>

    <script>
        function handleSearch(event) {
            event.preventDefault();
            const nisn = document.getElementById('nisnInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loader = document.getElementById('loader');

            errorMsg.style.display = 'none';
            loader.style.display = 'flex';

            // Memanggil fungsi Google Apps Script secara asynchronous
            google.script.run
                .withSuccessHandler(function(response) {
                    loader.style.display = 'none';
                    if (response.status === 'success') {
                        displayResult(response.data);
                    } else {
                        errorMsg.textContent = response.message;
                        errorMsg.style.display = 'block';
                    }
                })
                .withFailureHandler(function(error) {
                    loader.style.display = 'none';
                    errorMsg.textContent = 'Terjadi kesalahan koneksi server. Silakan coba lagi.';
                    errorMsg.style.display = 'block';
                })
                .cariDataSiswa(nisn);
        }

        function displayResult(data) {
            document.getElementById('resNama').textContent = data.nama;
            document.getElementById('resKelas').textContent = data.kelas;
            document.getElementById('resNisn').textContent = data.nisn;
            
            document.getElementById('resIndo').textContent = data.indo;
            setBatchBadge('resCapaianIndo', data.capaianIndo);

            document.getElementById('resMtk').textContent = data.mtk;
            setBatchBadge('resCapaianMtk', data.capaianMtk);

            document.getElementById('resRata').textContent = data.rata;
            setBatchBadge('resCapaianRata', data.capaianRata);

            // Transisi Tampilan Layer
            document.getElementById('layer1').style.display = 'none';
            document.getElementById('layer2').style.display = 'block';
        }

        function setBatchBadge(elementId, text) {
            const el = document.getElementById(elementId);
            const val = text ? text.toString().trim() : '-';
            el.textContent = val;
            el.className = 'badge ' + val.toLowerCase();
        }

        function resetForm() {
            document.getElementById('nisnInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('layer2').style.display = 'none';
            document.getElementById('layer1').style.display = 'block';
        }
    </script>
</body>
</html>
