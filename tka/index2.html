<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Nilai Try Out TKA - SMP Negeri 1 Moga</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Library Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 50%, #f8fafc 100%);
            --primary-blue: #0284c7;  /* Biru Cerah Modern */
            --accent-yellow: #ca8a04; /* Kuning Emas OSIS */
            --accent-green: #16a34a;  /* Hijau Segar */
            --text-dark: #0f172a;
            --text-gray: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(2, 132, 199, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .glow-circle {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(56, 189, 248, 0.25);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            animation: float 8s infinite alternate ease-in-out;
        }
        .glow-circle.two {
            background: rgba(250, 204, 21, 0.2);
            bottom: -50px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: all 0.3s ease;
        }

        .logo-container img {
            width: 95px;
            height: 95px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        h1 span {
            color: var(--primary-blue);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-gray);
            margin-bottom: 25px;
        }

        /* LAYER 1: FORM INPUT */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-gray);
        }

        .input-with-icon input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-with-icon input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.25);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-blue), #0369a1);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.45);
        }

        /* LAYER 2: HASIL NILAI */
        .result-container {
            display: none;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* IDENTITAS SISWA */
        .student-info {
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 18px;
            padding: 20px 15px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .student-info h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary-blue);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .student-info p {
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* CARD LIST NILAI */
        .scores-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
        }

        .score-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .score-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
        }

        .score-label {
            text-align: left;
        }

        .score-label h4 {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .badge {
            display: inline-block;
            padding: 3px 10px;
            font-size: 0.68rem;
            font-weight: 700;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.memadai { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
        .badge.baik { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .badge.kurang { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

        .score-value {
            text-align: right;
        }

        .score-num {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-blue);
        }

        /* TOMBOL AKSI (DOWNLOAD PDF & KEMBALI) */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-green), #15803d);
            border: none;
            color: #ffffff;
            padding: 13px;
            width: 100%;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: none; /* Sembunyikan default, muncul jika ada link */
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(22, 163, 74, 0.45);
        }

        .btn-back {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 13px;
            width: 100%;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-back:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .loader-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(2, 132, 199, 0.2);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #b91c1c;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--text-gray);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="glow-circle"></div>
    <div class="glow-circle two"></div>

    <div class="container">
        <div class="glass-card">
            <div class="logo-container">
                <img src="https://smpn1moga.sch.id/wp-content/uploads/2025/08/NEW-LOGO-SMP-1-MOGA-1024x961.jpg" alt="Logo SMPN 1 Moga">
            </div>
            
            <!-- LAYER 1: FORM INPUT -->
            <div id="layer1">
                <h1>TRY OUT <span>TKA</span></h1>
                <p class="subtitle">SMP Negeri 1 Moga</p>
                
                <form id="nisnForm" onsubmit="handleSearch(event)">
                    <div class="form-group">
                        <label for="nisnInput">Masukkan Nomor NISN Siswa</label>
                        <div class="input-with-icon">
                            <i class="fa-solid fa-id-card"></i>
                            <input type="number" id="nisnInput" placeholder="Contoh: 101192481" required autocomplete="off">
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">
                        <i class="fa-solid fa-magnifying-glass"></i> Cek Hasil Nilai
                    </button>
                    <div id="errorMsg" class="error-msg"></div>
                </form>
            </div>

            <!-- LAYER 2: HASIL NILAI -->
            <div id="layer2" class="result-container">
                <div class="student-info">
                    <h2 id="resNama">-</h2>
                    <p>Kelas: <span id="resKelas">-</span> &bull; NISN: <span id="resNisn">-</span></p>
                </div>

                <div class="scores-grid">
                    <!-- Bahasa Indonesia -->
                    <div class="score-card">
                        <div class="score-label">
                            <h4>Bahasa Indonesia</h4>
                            <div style="margin-top: 4px;">
                                <span id="resCapaianIndo" class="badge">-</span>
                            </div>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resIndo">0</div>
                        </div>
                    </div>

                    <!-- Matematika -->
                    <div class="score-card">
                        <div class="score-label">
                            <h4>Matematika</h4>
                            <div style="margin-top: 4px;">
                                <span id="resCapaianMtk" class="badge">-</span>
                            </div>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resMtk">0</div>
                        </div>
                    </div>

                    <!-- Rata-Rata -->
                    <div class="score-card" style="border-color: #bae6fd; background: #f0f9ff;">
                        <div class="score-label">
                            <h4>Nilai Rata-Rata</h4>
                            <div style="margin-top: 4px;">
                                <span id="resCapaianRata" class="badge">-</span>
                            </div>
                        </div>
                        <div class="score-value">
                            <div class="score-num" id="resRata" style="color: #0284c7;">0</div>
                        </div>
                    </div>
                </div>

                <!-- TOMBOL AKSI -->
                <div class="action-buttons">
                    <a id="btnDownloadPdf" href="#" target="_blank" class="btn-download">
                        <i class="fa-solid fa-file-pdf"></i> PDF SK HASIL TRYOUT 1
                    </a>
                    <button class="btn-back" onclick="resetForm()">
                        <i class="fa-solid fa-arrow-left"></i> Cari NISN Lain
                    </button>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2026 SMP Negeri 1 Moga &bull; Tim IT Spensamo
        </footer>
    </div>

    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="spinner"></div>
        <p style="color: var(--primary-blue); font-size: 0.9rem; font-weight: 600;">Memuat Data Siswa...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHLL8m0nZ-VG78PsH6wYjPYo6F0J8I1mrXA8bbT4FJynveGGuWmO0h5WMhFf4Vy8vM/exec";

        function handleSearch(event) {
            event.preventDefault();
            const nisn = document.getElementById('nisnInput').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loader = document.getElementById('loader');

            errorMsg.style.display = 'none';
            loader.style.display = 'flex';

            fetch(`${SCRIPT_URL}?nisn=${nisn}`)
                .then(response => response.json())
                .then(result => {
                    loader.style.display = 'none';
                    if (result && result.status === 'success') {
                        displayResult(result.data);
                        triggerConfetti();
                    } else {
                        errorMsg.textContent = result ? result.message : "Data tidak ditemukan.";
                        errorMsg.style.display = 'block';
                    }
                })
                .catch(error => {
                    loader.style.display = 'none';
                    errorMsg.textContent = 'Gagal terhubung ke server database. Periksa koneksi Anda.';
                    errorMsg.style.display = 'block';
                });
        }

        function triggerConfetti() {
            var duration = 2.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#0284c7', '#ca8a04', '#16a34a', '#38bdf8']
                });
                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#0284c7', '#ca8a04', '#16a34a', '#38bdf8']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function displayResult(data) {
            document.getElementById('resNama').textContent = data.nama ? data.nama.toUpperCase() : '-';
            document.getElementById('resKelas').textContent = data.kelas;
            document.getElementById('resNisn').textContent = data.nisn;
            
            document.getElementById('resIndo').textContent = data.indo;
            setBatchBadge('resCapaianIndo', data.capaianIndo);

            document.getElementById('resMtk').textContent = data.mtk;
            setBatchBadge('resCapaianMtk', data.capaianMtk);

            document.getElementById('resRata').textContent = data.rata;
            setBatchBadge('resCapaianRata', data.capaianRata);

            // Pengaturan Tombol Download PDF
            const btnDownload = document.getElementById('btnDownloadPdf');
            if (data.pdfLink && data.pdfLink.trim() !== '') {
                btnDownload.href = data.pdfLink.trim();
                btnDownload.style.display = 'flex'; // Tampilkan tombol jika link tersedia
            } else {
                btnDownload.style.display = 'none'; // Sembunyikan jika kosong
            }

            document.getElementById('layer1').style.display = 'none';
            document.getElementById('layer2').style.display = 'block';
        }

        function setBatchBadge(elementId, text) {
            const el = document.getElementById(elementId);
            const val = text ? text.toString().trim() : '-';
            el.textContent = val;
            el.className = 'badge ' + val.toLowerCase();
        }

        function resetForm() {
            document.getElementById('nisnInput').value = '';
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('layer2').style.display = 'none';
            document.getElementById('layer1').style.display = 'block';
        }
    </script>
</body>
</html>
